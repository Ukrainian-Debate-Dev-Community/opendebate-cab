name: nightly

# Every night: move the engine pin to the engine's latest main. When it
# changed, the move lands on the engine/bump branch with a pull request
# into nightly; CI runs on it, and a maintainer merges it like any other.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

# never two nightly runs at once
concurrency: nightly

jobs:
  engine-bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nightly
          fetch-depth: 0
      - name: Move the engine pin to its latest main
        id: bump
        run: |
          git submodule set-url engine https://github.com/Ukrainian-Debate-Dev-Community/opendebate-engine.git
          git submodule update --init engine
          before=$(git -C engine rev-parse HEAD)
          git -C engine fetch origin main
          git -C engine checkout origin/main
          git checkout -- .gitmodules
          after=$(git -C engine rev-parse HEAD)
          echo "short=$(git -C engine rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the pull request
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c engine/bump
          git add engine
          git commit -m "chore: engine at ${{ steps.bump.outputs.short }}"
          git push --force origin engine/bump
          if [ -z "$(gh pr list --head engine/bump --base nightly --state open --json number -q '.[].number')" ]; then
            gh pr create --head engine/bump --base nightly \
              --title "chore: engine at ${{ steps.bump.outputs.short }}" \
              --body "The engine's latest main. Merge when CI is green."
          else
            gh pr edit engine/bump --title "chore: engine at ${{ steps.bump.outputs.short }}"
          fi
          # pull requests opened by this token start no workflows themselves
          gh workflow run ci.yml --ref engine/bump
